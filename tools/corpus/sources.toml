# GameBoyGhost reference corpus — source registry.
# This is reference material, never training data.
# Raw bytes and normalized text live in $GBG_CORPUS_DIR, not in git.
version = 1

# ---------------------------------------------------------------- P0: hardware / emulator docs

[sources.pandocs]
id = "pandocs"
kind = "github_raw"
priority = "P0"
repo = "gbdev/pandocs"
ref = "auto"                      # resolved to a commit SHA and pinned in sources.lock.json
include = ["**/*.md", "**/*.txt"]
exclude = ["**/node_modules/**", "**/.github/**"]
license = "read"
rate_limit_rps = 1

[sources.awesome_gbdev]
id = "awesome_gbdev"
kind = "github_raw"
priority = "P0"
repo = "gbdev/awesome-gbdev"
ref = "auto"
include = ["README.md", "**/*.md"]
exclude = ["**/.github/**"]
license = "read"
rate_limit_rps = 1

