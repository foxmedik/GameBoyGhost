[project]
name = "gbg-corpus"
version = "0.1.0"
description = "GameBoyGhost reference corpus ingestion (not training data)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "trafilatura>=1.12",
  "selectolax>=0.3",
  "tenacity>=9",
  "sqlite-utils>=3.37",
  "pyyaml>=6",
  "tomli>=2; python_version < '3.11'",
  "pymupdf>=2.1",
]

[project.scripts]
gbg-corpus = "gbg_corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbg_corpus"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
